<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="mcfunction を Discord の ansi コードブロック用に、VS Code（Spyglass）と同じ色で色分けするツール">
<title>mcfunction → Discord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
/* Layout: source on top, Discord preview below. Single dark look, matched to Discord's code block. */
:root{
  color-scheme: dark;
  --bg:#1b1d22; --panel:#232529; --panel-2:#2b2d31; --line:#3a3c42;
  --fg:#dbdee1; --muted:#949ba4; --accent:#5865f2; --ok:#3ba55d; --warn:#f0b232; --bad:#ed4245;
  --code-bg:#2b2d31; --code-fg:#dbdee1;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:grid;gap:24px}
header{display:grid;gap:4px}
h1{margin:0;font-size:1.5rem;font-weight:700;text-wrap:balance;font-family:var(--mono);letter-spacing:-.01em}
h1 .arrow{color:var(--muted);font-weight:400}
h1 .d{color:var(--accent)}
header p{margin:0;color:var(--muted);max-width:72ch}
code{font-family:var(--mono);font-size:.9em}
.panes{display:grid;grid-template-columns:1fr;gap:20px}
.pane{min-width:0;display:grid;grid-template-rows:auto 1fr auto;gap:8px}
.pane-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
textarea#src{width:100%;box-sizing:border-box;min-height:260px;resize:vertical;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:12px;font:13px/1.55 var(--mono);tab-size:4;white-space:pre;overflow:auto}
textarea#src:focus,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0;display:grid;grid-template-columns:40px 1fr;gap:12px;align-content:start}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font:700 .8rem var(--mono);color:#fff}
.msg-body{min-width:0}
.who{font-weight:700;font-size:.95rem}.who small{color:var(--muted);font-weight:400;font-size:.72rem;margin-left:6px}
pre#preview{margin:4px 0 0;background:var(--code-bg);color:var(--code-fg);border:1px solid #1e1f22;border-radius:4px;padding:8px;font:.875rem/1.125rem var(--mono);white-space:pre-wrap;word-break:break-word;max-height:520px;overflow:auto}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:none;border-radius:4px}
.copy{background:var(--accent);color:#fff;font-weight:700;padding:10px 18px;transition:background-color .2s}
.copy.done{background:var(--ok)}
.ghost{background:var(--panel-2);color:var(--fg);padding:8px 12px;font-size:.85rem}
.ghost:hover{background:var(--line)}
.count{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.count.warn{color:var(--warn)}.count.bad{color:var(--bad)}
.opts{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
#fallback{width:100%;box-sizing:border-box;min-height:120px;background:var(--panel);color:var(--fg);border:1px solid var(--warn);border-radius:6px;font:12px var(--mono);padding:8px}
.note{font-size:.8rem;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>mcfunction <span class="arrow">→</span> <span class="d">Discord</span></h1>
    <p>mcfunction を貼ると、Discord の <code>```ansi</code> コードブロックで色付き表示されるテキストを作ります。色は VS Code（Dark Modern）＋ Spyglass と同じ色をカラーコード（24bit）で指定します。</p>
  </header>

  <div class="panes">
    <div class="pane">
      <div class="pane-head"><span class="label">mcfunction</span><button class="ghost" id="clear" type="button">クリア</button></div>
      <textarea id="src" spellcheck="false" placeholder="ここに mcfunction を貼り付け" aria-label="mcfunction ソース"></textarea>
      <div class="opts">
        <label><input type="checkbox" id="optComments"> コメント行を除外</label>
        <label><input type="checkbox" id="optBlank"> 空行を除外</label>
      </div>
    </div>
    <div class="pane">
      <div class="pane-head"><span class="label">Discord プレビュー</span></div>
      <div class="msg">
        <div class="avatar">mc</div>
        <div class="msg-body">
          <div class="who">you<small>今日</small></div>
          <pre id="preview"></pre>
        </div>
      </div>
      <div class="actions">
        <button class="copy" id="copy" type="button">Discord 用にコピー</button>
        <span class="count" id="count"></span>
      </div>
      <p class="note">24bit カラーに対応していない Discord では、近い8色で表示されます。</p>
    </div>
  </div>
  <textarea id="fallback" hidden readonly aria-label="コピー用テキスト"></textarea>
</div>

<script src="lib/highlight.js"></script>
<script>
const {tokenize, toAnsi, toHtml} = McfunctionAnsi;

/* ---------- UI ---------- */
function $(q){ return document.querySelector(q); }
const src = $("#src"), preview = $("#preview"), count = $("#count");
let lastAnsi = "";

function render(){
  const lines = tokenize(src.value, {noComments:$("#optComments").checked, noBlank:$("#optBlank").checked});
  preview.innerHTML = toHtml(lines) || '<span style="color:var(--muted)">（ここにプレビューが出ます）</span>';
  lastAnsi = toAnsi(lines);
  const n = [...lastAnsi].length;
  count.textContent = `${n.toLocaleString()} / 2,000 文字` + (n>2000 ? (n>4000 ? "（Nitroでも超過）" : "（Nitroなら送信可）") : "");
  count.className = "count" + (n>4000 ? " bad" : n>2000 ? " warn" : "");
  try{ localStorage.setItem("mcf-discord-src", src.value); }catch(e){}
}

let saved = null;
try{ saved = localStorage.getItem("mcf-discord-src"); }catch(e){}
src.value = saved ?? "";

src.addEventListener("input", render);
src.addEventListener("keydown", e => {
  if(e.key === "Tab" && !e.shiftKey){ e.preventDefault(); const p = src.selectionStart; src.setRangeText("    ",p,src.selectionEnd,"end"); render(); }
});
$("#optComments").onchange = render;
$("#optBlank").onchange = render;
$("#clear").onclick = () => { src.value = ""; render(); src.focus(); };

const fb = $("#fallback");
function copyText(text, btn, label, doneLabel){
  const done = () => {
    fb.hidden = true;
    btn.textContent = doneLabel; btn.classList.add("done");
    clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = label; btn.classList.remove("done"); }, 1800);
  };
  const fail = () => {
    fb.value = text; fb.hidden = false; fb.focus(); fb.select();
    btn.textContent = "下の欄を選択してコピーしてください";
  };
  try{ navigator.clipboard.writeText(text).then(done, fail); }catch(e){ fail(); }
}
$("#copy").onclick = () => copyText(lastAnsi, $("#copy"), "Discord 用にコピー", "コピーしました");

render();
</script>
</body>
</html>
